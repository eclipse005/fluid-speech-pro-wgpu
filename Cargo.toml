[package]
name = "fluid-speech-pro-wgpu"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Fluid Speech Pro inference in Rust with CPU and wgpu backends"

[lib]
name = "fluid_speech_pro"
path = "src/lib.rs"

[features]
default = []
# Exposes the internal modules to this repository's verification and benchmark
# binaries. Off by default so a dependent crate sees only `api`.
internals = []

[[bin]]
name = "fsp"
path = "src/bin/fsp.rs"

# Developer tools: they need crate internals, so they only exist with the feature on.
[[bin]]
name = "fsp-verify"
path = "src/bin/verify.rs"
required-features = ["internals"]

[[bin]]
name = "fsp-bench"
path = "src/bin/bench.rs"
required-features = ["internals"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
rustfft = "6"
hound = "3"
libm = "0.2"
rayon = "1.10"
gemm = "0.18"
memmap2 = "0.9"
wgpu = "30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
unicode-general-category = "1"

[profile.release]
debug = false
