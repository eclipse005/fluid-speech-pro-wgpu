name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: Build and upload the three platform binaries
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Check internals feature
        run: cargo check --release --features internals

  package:
    name: package / ${{ matrix.name }}
    if: startsWith(github.ref, 'refs/tags/v') || inputs.package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            exe: ""
            archive: tar.gz
            rustflags: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            exe: .exe
            archive: zip
            rustflags: -C target-feature=+crt-static
          - os: macos-15
            target: aarch64-apple-darwin
            name: macos-arm64
            exe: ""
            archive: tar.gz
            rustflags: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin fsp
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Smoke test
        shell: bash
        run: ./target/${{ matrix.target }}/release/fsp${{ matrix.exe }} --help

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          dir="fluid-speech-pro-wgpu-${{ matrix.name }}"
          mkdir -p "$dir"
          cp "target/${{ matrix.target }}/release/fsp${{ matrix.exe }}" "$dir/"
          cp README.md LICENSE "$dir/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$dir.zip" "$dir" > /dev/null
          else
            tar czf "$dir.tar.gz" "$dir"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: fluid-speech-pro-wgpu-${{ matrix.name }}.${{ matrix.archive }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: fluid-speech-pro-wgpu-${{ matrix.name }}.${{ matrix.archive }}
          generate_release_notes: true
